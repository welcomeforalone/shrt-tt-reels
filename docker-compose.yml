services:
  warp:
    image: caomingjun/warp
    container_name: warp_proxy
    restart: always
    cap_add:
      - NET_ADMIN
      - MKNOD
      - AUDIT_WRITE
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    ports:
      - "1080:1080"
    networks:
      - bot_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bgutil-pot:
    image: ghcr.io/jim60105/bgutil-pot:latest
    container_name: bgutil_pot
    restart: always
    networks:
      - bot_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    image: ghcr.io/welcomeforalone/shrt-tt-reels:latest
    container_name: tiktok_downloader_bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      - warp
      - bgutil-pot
    networks:
      - bot_network
    volumes:
      - ./cookies.txt:/home/botuser/app/cookies.txt
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

networks:
  bot_network:
    driver: bridge